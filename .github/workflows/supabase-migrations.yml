# Applique automatiquement les migrations Supabase quand elles changent sur main.
# Secrets GitHub requis (Settings > Secrets and variables > Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   identifiant du projet (Project Settings > General)
#   SUPABASE_DB_PASSWORD   mot de passe de la base (Project Settings > Database)
name: Migrations Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secrets Supabase manquants (voir l'en-tête de ce fichier)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Appliquer les migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
